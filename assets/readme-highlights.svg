<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MiniTrainSys portfolio highlights</title>
  <desc id="desc">Six headline results covering kernel speed, memory, training throughput, FSDP scaling, and model interpretability.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1200" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="0.52" stop-color="#FAF8FF"/>
      <stop offset="1" stop-color="#F3FBF8"/>
    </linearGradient>

    <linearGradient id="heading" x1="330" y1="0" x2="860" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#64748B" flood-opacity="0.11"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="498" rx="24" fill="url(#panel)" stroke="#DCE6F2" stroke-width="2"/>

  <text x="600" y="52" text-anchor="middle"
        font-family="Inter, 'Segoe UI', Arial, sans-serif"
        font-size="22" font-weight="700" letter-spacing="1.8" fill="url(#heading)">
    PORTFOLIO HIGHLIGHTS
  </text>
  <text x="600" y="82" text-anchor="middle"
        font-family="Inter, 'Segoe UI', Arial, sans-serif"
        font-size="15" font-weight="450" fill="#64748B">
    Measured systems results and reproducible interpretability experiments
  </text>

  <g filter="url(#shadow)">
    <rect x="42" y="112" width="348" height="142" rx="18" fill="white" stroke="#BFDBFE"/>
    <rect x="426" y="112" width="348" height="142" rx="18" fill="white" stroke="#DDD6FE"/>
    <rect x="810" y="112" width="348" height="142" rx="18" fill="white" stroke="#A7F3D0"/>

    <rect x="42" y="286" width="348" height="142" rx="18" fill="white" stroke="#BAE6FD"/>
    <rect x="426" y="286" width="348" height="142" rx="18" fill="white" stroke="#FDE68A"/>
    <rect x="810" y="286" width="348" height="142" rx="18" fill="white" stroke="#C4B5FD"/>
  </g>

  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <rect x="42" y="112" width="7" height="142" rx="3.5" fill="#3B82F6"/>
    <text x="72" y="145" font-size="14" font-weight="700" fill="#2563EB">TRITON RMSNORM</text>
    <text x="72" y="197" font-size="42" font-weight="760" fill="#0F172A">6.51×</text>
    <text x="72" y="226" font-size="15" font-weight="500" fill="#64748B">fwd+bwd vs PyTorch · 57,344 tokens</text>

    <rect x="426" y="112" width="7" height="142" rx="3.5" fill="#8B5CF6"/>
    <text x="456" y="145" font-size="13" font-weight="700" fill="#7C3AED">FUSED LINEAR CROSS ENTROPY</text>
    <text x="456" y="197" font-size="42" font-weight="760" fill="#0F172A">94.0%</text>
    <text x="456" y="226" font-size="15" font-weight="500" fill="#64748B">vs PyTorch · 8,192-token comparison</text>

    <rect x="810" y="112" width="7" height="142" rx="3.5" fill="#10B981"/>
    <text x="840" y="145" font-size="14" font-weight="700" fill="#059669">END-TO-END TRAINING</text>
    <text x="840" y="197" font-size="42" font-weight="760" fill="#0F172A">2.201×</text>
    <text x="840" y="226" font-size="16" font-weight="500" fill="#64748B">throughput at equal memory</text>

    <rect x="42" y="286" width="7" height="142" rx="3.5" fill="#0EA5E9"/>
    <text x="72" y="319" font-size="14" font-weight="700" fill="#0284C7">DISTRIBUTED TRAINING</text>
    <text x="72" y="371" font-size="42" font-weight="760" fill="#0F172A">92.24%</text>
    <text x="72" y="400" font-size="16" font-weight="500" fill="#64748B">FSDP weak-scaling efficiency</text>

    <rect x="426" y="286" width="7" height="142" rx="3.5" fill="#F59E0B"/>
    <text x="456" y="319" font-size="14" font-weight="700" fill="#D97706">INTERPRETABILITY</text>
    <text x="456" y="371" font-size="42" font-weight="760" fill="#0F172A">98.79%</text>
    <text x="456" y="400" font-size="16" font-weight="500" fill="#64748B">name-only first-token retrieval</text>

    <rect x="810" y="286" width="7" height="142" rx="3.5" fill="#8B5CF6"/>
    <text x="840" y="319" font-size="14" font-weight="700" fill="#7C3AED">CONDITIONED RETRIEVAL</text>
    <text x="840" y="371" font-size="34" font-weight="760" fill="#0F172A">45.28% → 96.38%</text>
    <text x="840" y="400" font-size="16" font-weight="500" fill="#64748B">whole-value retrieval after first token</text>
  </g>

  <text x="600" y="468" text-anchor="middle"
        font-family="Inter, 'Segoe UI', Arial, sans-serif"
        font-size="13" font-weight="450" fill="#64748B">
    293M MoE · 4× RTX 4090 24 GB · PyTorch 2.5.1 · CUDA 11.8 · Triton 3.1
  </text>
</svg>
